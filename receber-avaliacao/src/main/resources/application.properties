quarkus.http.host=0.0.0.0
quarkus.http.port=8080
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5174}
quarkus.http.cors.methods=POST,OPTIONS
quarkus.http.cors.headers=Content-Type,Idempotency-Key

app.dynamodb.table=${AVALIACOES_TABLE:avaliacoes}
app.dynamodb.endpoint=${DYNAMODB_ENDPOINT:}
app.aws.region=${AWS_REGION:us-east-1}

%prod.quarkus.log.category."com.fiap.feedback".level=INFO
