quarkus.lambda.handler=report
quarkus.compose.devservices.enabled=false
quarkus.devservices.enabled=false

app.aws.region=${AWS_REGION:us-east-1}
app.dynamodb.endpoint=${DYNAMODB_ENDPOINT:}
app.dynamodb.evaluations-table=${AVALIACOES_TABLE:avaliacoes}
app.dynamodb.generations-table=${REPORT_GENERATION_TABLE:geracoes-relatorios}
app.s3.endpoint=${S3_ENDPOINT:}
app.s3.bucket=${REPORTS_BUCKET:fiap-feedback-relatorios-local}
app.ses.endpoint=${SES_ENDPOINT:}
app.email.sender=${SES_FROM_EMAIL}
app.email.recipient=${ADMIN_EMAIL}
app.report.processing-lease-seconds=${REPORT_PROCESSING_LEASE_SECONDS:300}
app.report.time-zone=${REPORT_TIME_ZONE:America/Sao_Paulo}

%prod.quarkus.log.category."com.fiap.feedback.relatorio".level=INFO
