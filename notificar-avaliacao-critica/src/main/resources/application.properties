quarkus.lambda.handler=stream
quarkus.compose.devservices.enabled=false
quarkus.devservices.enabled=false

app.aws.region=${AWS_REGION:us-east-1}
app.dynamodb.endpoint=${DYNAMODB_ENDPOINT:}
app.dynamodb.notification-table=${NOTIFICATION_TABLE:notificacoes-avaliacoes}
app.ses.endpoint=${SES_ENDPOINT:}
app.alert.sender=${SES_FROM_EMAIL}
app.alert.recipient=${ADMIN_EMAIL}
app.alert.processing-lease-seconds=${ALERT_PROCESSING_LEASE_SECONDS:300}

%prod.quarkus.log.category."com.fiap.feedback.notificacao".level=INFO
