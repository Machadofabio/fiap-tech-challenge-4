name: Deploy AWS and GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aws-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-backend:
    name: Build and deploy backend with SAM
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_STACK_NAME: ${{ vars.AWS_STACK_NAME }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      SAM_ARTIFACT_BUCKET: ${{ vars.SAM_ARTIFACT_BUCKET }}
      ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
      SES_FROM_EMAIL: ${{ vars.SES_FROM_EMAIL }}
      EVALUATION_THROTTLE_RATE_LIMIT: ${{ vars.EVALUATION_THROTTLE_RATE_LIMIT || '2' }}
      EVALUATION_THROTTLE_BURST_LIMIT: ${{ vars.EVALUATION_THROTTLE_BURST_LIMIT || '5' }}

    outputs:
      api_url: ${{ steps.api-url.outputs.value }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v3
        with:
          use-installer: true

      - name: Check required deployment settings
        shell: bash
        run: |
          set -euo pipefail
          for name in AWS_DEPLOY_ROLE_ARN AWS_REGION AWS_STACK_NAME ADMIN_EMAIL SES_FROM_EMAIL; do
            if [[ -z "${!name:-}" ]]; then
              echo "Configure $name as a variable in the GitHub environment dev." >&2
              exit 1
            fi
          done

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-actions-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Ensure SAM artifact bucket exists
        id: sam-artifacts
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          bucket="${SAM_ARTIFACT_BUCKET:-fiap-tech-challenge-4-sam-artifacts-${account_id}-${AWS_REGION}}"

          if aws s3api head-bucket --bucket "$bucket" >/dev/null 2>&1; then
            echo "Reusing SAM artifact bucket: $bucket"
          else
            echo "Creating SAM artifact bucket: $bucket"
            if [[ "$AWS_REGION" == "us-east-1" ]]; then
              aws s3api create-bucket --bucket "$bucket" --region "$AWS_REGION"
            else
              aws s3api create-bucket \
                --bucket "$bucket" \
                --region "$AWS_REGION" \
                --create-bucket-configuration "LocationConstraint=$AWS_REGION"
            fi
          fi

          bucket_region="$(aws s3api get-bucket-location \
            --bucket "$bucket" \
            --query LocationConstraint \
            --output text)"
          if [[ "$bucket_region" == "None" || "$bucket_region" == "null" ]]; then
            bucket_region="us-east-1"
          fi
          if [[ "$bucket_region" != "$AWS_REGION" ]]; then
            echo "SAM artifact bucket $bucket is in $bucket_region, expected $AWS_REGION." >&2
            exit 1
          fi
          echo "bucket=$bucket" >> "$GITHUB_OUTPUT"

      - name: Build Lambda packages
        run: |
          ./gradlew --no-daemon \
            :receber-avaliacao:quarkusBuild \
            :notificar-avaliacao-critica:quarkusBuild \
            :gerar-relatorio-semanal:quarkusBuild

      - name: Deploy SAM backend stack
        run: |
          sam deploy \
            --template-file template.yaml \
            --stack-name "$AWS_STACK_NAME" \
            --region "$AWS_REGION" \
            --s3-bucket "${{ steps.sam-artifacts.outputs.bucket }}" \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "AdminEmail=$ADMIN_EMAIL" \
              "SesFromEmail=$SES_FROM_EMAIL" \
              "EvaluationThrottleRateLimit=$EVALUATION_THROTTLE_RATE_LIMIT" \
              "EvaluationThrottleBurstLimit=$EVALUATION_THROTTLE_BURST_LIMIT"

      - name: Read deployed API URL
        id: api-url
        shell: bash
        run: |
          set -euo pipefail
          api_url="$(aws cloudformation describe-stacks \
            --stack-name "$AWS_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='EvaluationsApiUrl'].OutputValue | [0]" \
            --output text)"
          if [[ -z "$api_url" || "$api_url" == "None" ]]; then
            echo "EvaluationsApiUrl output was not found in stack $AWS_STACK_NAME." >&2
            exit 1
          fi
          echo "value=$api_url" >> "$GITHUB_OUTPUT"

  deploy-frontend:
    name: Build and publish frontend to GitHub Pages
    runs-on: ubuntu-latest
    needs: deploy-backend
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install frontend dependencies
        run: npm --prefix frontend install --no-package-lock --no-audit --no-fund

      - name: Build frontend
        env:
          VITE_API_MODE: http
          VITE_API_BASE_URL: ${{ needs.deploy-backend.outputs.api_url }}
        run: npm --prefix frontend run build -- --base=/fiap-tech-challenge-4/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
